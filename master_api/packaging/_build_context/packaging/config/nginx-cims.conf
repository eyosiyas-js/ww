# ── CIMS Nginx Configuration ────────────────────────────────────────────────
# Serves the frontend static files and proxies API requests to the backend.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ── Frontend (static files) ─────────────────────────────────────────────
    root /opt/cims/frontend;
    index index.html;

    # SPA routing: serve index.html for any route the frontend handles
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long requests
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # File upload size (adjust as needed)
        client_max_body_size 50M;
    }

    # ── Uploaded files ──────────────────────────────────────────────────────
    location /uploads/ {
        alias /opt/cims/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── WebSocket endpoint ──────────────────────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Static asset caching ────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
